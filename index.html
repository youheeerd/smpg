<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMPG Members Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width "page" at a time; the player's own wavelength runs under the header and doubles as the progress line. Single dark theme by choice. */
:root{
  color-scheme: dark;
  --bg:#0f191d;
  --surface:#17252a;
  --raised:#1e3036;
  --line:#2c4047;
  --ink:#f2ece3;
  --muted:#9db0af;
  --accent:#ff9f7a;
  --accent-ink:#2b140a;
  --warn:#ffd08a;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(255,159,122,.13), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(110,190,190,.10), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 4px;flex:none}
.mark{font-family:var(--display);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.01em}
.pageno{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#strip{display:block;width:100%;height:30px;flex:none}
main{flex:1;overflow-y:auto;padding:18px 0 20px;display:flex;flex-direction:column;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.leaf{display:flex;flex-direction:column;gap:16px;flex:1;animation:turn .32s ease both}
@keyframes turn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
footer{flex:none;display:flex;gap:10px;padding:12px 0 20px}
footer:empty{padding:0 0 8px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.13;margin:0;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.hero{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(84px,30vw,132px);line-height:.86;letter-spacing:-.03em;margin:10px 0 0}
.hero span{color:var(--accent)}
p{margin:0;color:var(--muted);max-width:42ch}
p.lede{color:var(--ink);font-size:18px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-size:14px;min-height:21px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=email]{
  width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;outline:none;
}
input::placeholder{color:#6f8584}
input:focus-visible,button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{font-family:var(--display);font-size:22px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.btn{flex:1;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:15px 20px;border-radius:999px;font-size:16px;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);flex:0 0 auto;font-weight:500}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px 0;align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink);transition:background .15s,border-color .15s}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.group{display:flex;flex-direction:column;gap:9px}
.group>span{font-size:13px;color:var(--muted);letter-spacing:.04em}
.opt{width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;padding:15px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:16px;line-height:1.35;transition:background .15s,border-color .15s,transform .12s,opacity .25s}
.opt:hover{background:var(--raised)}
.opt:active{transform:scale(.99)}
.opt b{font-family:var(--display);font-style:italic;font-weight:500;color:var(--accent);font-size:18px;min-width:22px;line-height:1.2}
.opt small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--raised)}
.opt[aria-pressed=true] b{color:var(--ink)}
.answered .opt[aria-pressed=false]{opacity:.45}
.duel{display:flex;flex-direction:column;gap:10px;flex:1;min-height:260px}
.duel .opt{flex:1;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:24px;line-height:1.2;padding:22px}
.duel .or{align-self:center;font-family:var(--display);font-style:italic;color:var(--muted);font-size:18px}
.dial{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.dial .stop{font-family:var(--display);font-size:24px;line-height:1.2;min-height:60px;display:flex;align-items:center}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.timer{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.timer .t{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.timer .t i{display:block;height:100%;width:100%;background:var(--accent)}
.toast{min-height:22px;font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:28px;color:var(--accent);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:14px;align-items:center}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.goal{display:flex;gap:10px;align-items:center}
.goal span{font-family:var(--display);font-style:italic;color:var(--accent);width:24px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.goal input{padding:12px 14px;font-size:15px}
.goal.ok input{border-color:var(--accent)}
.freq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.freq canvas{width:100%;height:90px;display:block}
.freq .val{display:flex;align-items:baseline;justify-content:space-between}
.freq .val strong{font-family:var(--display);font-style:italic;font-size:54px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.score .top{display:flex;align-items:center;gap:18px}
.score strong{font-family:var(--display);font-style:italic;font-weight:700;font-size:76px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.25em}
.score .top span{font-size:14px;color:var(--muted)}
.score canvas{width:100%;height:64px;display:block}
.part{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px}
.part .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.part .t{grid-column:1/-1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.part .t i{display:block;height:100%;background:var(--accent)}
.part small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.host{border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.host h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);margin:0;font-weight:600}
.trait{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.trait .tn{color:var(--ink);font-weight:600}
.trait .n{color:var(--muted);font-variant-numeric:tabular-nums}
.trait .track{grid-column:1/-1;height:6px;background:var(--line);border-radius:6px;position:relative;margin:3px 6px}
.trait .track i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.trait .track.low i{background:var(--bg);border:2px solid var(--accent)}
.trait .ends{grid-column:1/-1;text-transform:none;letter-spacing:0;font-size:11.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.spacer{flex:1}
input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;outline:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;letter-spacing:.12em;color:var(--accent);user-select:all}
.mini{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--ink);white-space:nowrap}
.mini:disabled{opacity:.5;cursor:default}
.mini.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.coderow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.coderow span{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.coderow small{display:block;color:var(--muted);font-size:12.5px}
.row{flex-wrap:wrap}
#hlabel{flex:1;width:auto;min-width:0;padding:11px 14px;font-size:15px}
@media (prefers-reduced-motion:reduce){.leaf{animation:none}.opt,.btn{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header><div class="mark">smpg</div><div class="pageno" id="pageno"></div></header>
  <canvas id="strip" aria-hidden="true"></canvas>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<script src="config.js"></script>
<script>
"use strict";
/* ---------- content ---------- */
var LIMIT = 12000;            /* ms to earn the instinct bonus */
var NGOALS = 5;
var TOPICS = ["Music","Food and cooking","Travel","Fitness","Startups","Art and design","Film and TV","Books","Faith","Fashion","Tech","Sports","Outdoors","Gaming","Wellness","Politics and ideas","Parenting","Money and investing","Nightlife","Volunteering"];
var INTENTS = [["Professional","Business"],["Platonic","Friendly"],["Personal","Close friend"],["Passionate","Physical"],["Partnership","Romantic, and all of the above"]];
var SCENES = ["A slow weekend morning over coffee","A sunny walk through the park","A lazy Sunday brunch","An afternoon wandering a gallery or bookstore","A weekday drink after work","A night of live music or trivia"];
var GENDERS = ["Woman","Man","Non-binary","Prefer not to say"];
var ORIENT = ["Straight","Gay or lesbian","Bisexual","Pansexual","Asexual","Prefer not to say"];
var AGES = ["21 to 27","28 to 34","35 to 44","45 to 54","55+"];
var GOAL_HINTS = ["This year I will...","Within five years I want to...","I want to learn...","For my health, I will...","Someday I will..."];
var TRAITS = {
  SOC:["Social energy","Recharges alone","Recharges with people"],
  SPN:["Spontaneity","Plans ahead","Goes with the moment"],
  CUR:["Curiosity","Prefers the familiar","Seeks the new"],
  WRM:["Warmth","Reserved","Openly caring"],
  STD:["Steadiness","Reacts strongly","Calm under stress"],
  DIR:["Directness","Diplomatic","Plain-spoken"],
  DRV:["Drive","Easygoing","Goal-first"],
  IND:["Independence","Interdependent","Needs space"],
  PLY:["Playfulness","Earnest","Lighthearted"],
  PCE:["Pace of life","Slow, savoring","Fast, moving"]
};
var THEMES = {
  "Career and craft":["promot","business","lead","skill","career","job","company","launch","startup","profession"],
  "Money and security":["save","saving","invest","debt","retire","financ","money","wealth","income","buy a home","own a home","pay off"],
  "Family and parenting":["kid","child","family","parent","raise","mom","dad","mother","father","daughter"],
  "Romance and partnership":["partner","marry","marriage","married","relationship","love","wife","husband","dating"],
  "Friendships and community":["friend","community","neighbor","host","social"],
  "Health and fitness":["run","strength","sleep","health","marathon","gym","fit","weight","yoga","work out","exercise","diet","sober","therapy","mental"],
  "Adventure and travel":["travel","explore","countr","hike","hiking","trip","visit","adventure","abroad"],
  "Learning and growth":["learn","read","degree","language","study","course","school","master","class"],
  "Creativity and hobbies":["write","paint","music","create","album","novel","art","design","photograph","guitar","piano","sing"],
  "Home and lifestyle":["house","garden","cook","home","apartment","renovate","declutter","move to"],
  "Faith and meaning":["faith","purpose","meditat","spiritual","god","pray","church","mindful","peace","kind","grateful","gratitude"],
  "Giving back":["volunteer","mentor","donat","give back","charity","help others"]
};
var THEME_RE = {};
Object.keys(THEMES).forEach(function(th){ THEME_RE[th] = new RegExp("\\b(" + THEMES[th].join("|") + ")", "i"); });
var ROUNDS = ["Everyday life","People and pace"];
/* Ten moments, three ways to answer: pick (four cards), duel (this or that), dial (a five-stop slider). Every option carries trait tags. */
var Q = [
{t:"pick",q:"Your flight is delayed 4 hours. You:",o:[["Strike up a conversation with whoever is nearby","SOC+ PLY+"],["Find a quiet corner with a book or podcast","SOC- STD+"],["Rebook, then explore the city nearby","SPN+ CUR+"],["Camp near an outlet and get work done","DRV+ SPN-"]]},
{t:"duel",q:"It's Saturday with no plans. Your ideal start:",o:[["Out the door with no destination","SPN+ PCE+"],["Slow coffee, then see what feels right","PCE- STD+"]]},
{t:"pick",q:"A friend arrives 30 minutes late with no text. You:",o:[["Say you're glad they made it","WRM+ STD+"],["Tease them about it","PLY+ DIR+"],["Tell them plainly it bugged you","DIR+"],["Say nothing, but notice","IND+ DIR-"]]},
{t:"dial",q:"The plan changes at the last minute. How do you take it?",ends:["Thrown off","Love it"],o:[["It throws off my whole day","STD- SPN-"],["Annoyed at first, then I adapt","SPN-"],["Fine either way","STD+"],["I kind of enjoy the detour","SPN+ STD+"],["Best part of the day","SPN+ PLY+"]]},
{t:"pick",q:"Choosing a vacation:",o:[["Same place you love, again","CUR- STD+"],["Somewhere none of your friends have been","CUR+ IND+"],["A place full of other travelers to meet","SOC+ CUR+"],["Wherever someone you love is excited to go","WRM+ IND-"]]},
{t:"duel",q:"After an argument with someone close, you:",o:[["Reach out first, and soon","WRM+ DIR+"],["Give it space, then talk","IND+ STD+"]]},
{t:"pick",q:"The group chat says \"I don't mind\" to every restaurant idea. You:",o:[["Make the call yourself","DRV+ DIR+"],["Offer two options to pick from","DIR+ WRM+"],["Wait for someone else to decide","DIR- SPN+"],["Suggest drawing from a hat","PLY+ SPN+"]]},
{t:"dial",q:"A promotion offers more pay but longer hours. How fast do you say yes?",ends:["Never","Instantly"],o:[["It's a no. My time matters more","PCE- DRV-"],["Probably not","PCE-"],["Depends who else it affects","WRM+ STD+"],["Yes, once I've negotiated","DRV+ DIR+"],["Yes, before they finish the sentence","DRV+ PCE+"]]},
{t:"pick",q:"Ideal Sunday evening:",o:[["Dinner with a few friends","SOC+ WRM+"],["Cooking something new, alone","CUR+ IND+"],["A movie marathon","PCE- STD+"],["Exploring a new neighborhood","CUR+ SPN+"]]},
{t:"duel",q:"It's the end of a good night out. You:",o:[["Want to keep it going","PCE+ SOC+"],["Slip out quietly, happy","IND+ SOC-"]]}
];
var PER_ROUND = 5;

/* ---------- state ---------- */
var KEY = "smpg-site-v1";
var S, photo = null, busy = false, tick = 0, pulse = 0, counted = false, dialVal = 2;
var still = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function blankGoals(){ var a=[]; for(var i=0;i<NGOALS;i++) a.push(""); return a; }
function newRun(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fresh(){ return {runId:newRun(), startedAt:new Date().toISOString(), log:[], verified:false, reqSent:false, i:0, mode:"play", code:"", email:"", name:"", adult:false, area:"", gender:"", orient:"", age:"", topics:[], intent:0, freq:5, freqSet:null, ans:{}, order:{}, seen:{}, fast:{}, goals:blankGoals(), scene:-1, host:false}; }
function normalize(v){
  var s = Object.assign(fresh(), v || {});
  if(!Array.isArray(s.goals)) s.goals = blankGoals();
  s.goals = s.goals.slice(0,NGOALS).map(String); while(s.goals.length<NGOALS) s.goals.push("");
  if(!Array.isArray(s.topics)) s.topics = [];
  if(!Array.isArray(s.log)) s.log = [];
  ["ans","order","seen","fast"].forEach(function(k){ if(!s[k] || typeof s[k]!=="object") s[k] = {}; });
  Object.keys(s.ans).forEach(function(k){ if(!Q[k] || !Q[k].o[s.ans[k]]) { delete s.ans[k]; delete s.fast[k]; } });
  if(typeof s.i!=="number" || s.i<0) s.i = 0;
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} queueSync(false); }
function load(){ try{ var v = JSON.parse(localStorage.getItem(KEY)); if(v && typeof v.i==="number") return v; }catch(e){} return null; }
function steps(){
  if(S.mode==="request") return ["door","reqEmail","about","goals","reqDone"];
  var a = ["door","signup","about","topics","intent"];
  if(S.intent>=4) a.push("freq");
  for(var k=0;k<Q.length;k++){ if(k%PER_ROUND===0) a.push("r"+(k/PER_ROUND)); a.push("q"+k); }
  a.push("goals","final","done");
  return a;
}
function esc(t){ return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function $(id){ return document.getElementById(id); }
function shuffle(n){ var a=[],i,j,t; for(i=0;i<n;i++)a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }
function words(t){ return t.trim().split(/\s+/).filter(Boolean).length; }
function codeOk(){ return S.verified===true; }

/* ---------- scoring ---------- */
function traitScores(){
  var out={}, k;
  for(k in TRAITS) out[k]={net:0,n:0};
  Object.keys(S.ans).forEach(function(qi){
    Q[qi].o[S.ans[qi]][1].split(" ").forEach(function(t){ var c=t.slice(0,3); out[c].net += t.slice(3)==="+"?1:-1; out[c].n++; });
  });
  for(k in out) out[k].score = out[k].n ? Math.round(50+50*out[k].net/out[k].n) : 50;
  return out;
}
function goalHasTheme(g){ return Object.keys(THEME_RE).some(function(th){ return THEME_RE[th].test(g); }); }
function goalThemes(){
  var counts={}, total=0;
  S.goals.forEach(function(g){ Object.keys(THEME_RE).forEach(function(th){ if(THEME_RE[th].test(g)){ counts[th]=(counts[th]||0)+1; total++; } }); });
  return Object.keys(counts).map(function(th){return [th, Math.round(100*counts[th]/total)];}).sort(function(a,b){return b[1]-a[1];});
}
function fastCount(from,to){ var c=0; for(var k=from;k<to;k++) if(S.ans[k]!==undefined && S.fast[k]===true) c++; return c; }
/* SMPG score, 0 to 100 = Lean (50) + Instinct (30) + Direction (20). */
function scoreParts(){
  var t=traitScores(), k, sum=0, n=0;
  for(k in t){ if(t[k].n){ sum+=Math.abs(t[k].score-50)/50; n++; } }
  var lean = Math.round(50*(n?sum/n:0));
  var instinct = 3*fastCount(0,Q.length);
  var direction = 4*S.goals.filter(goalHasTheme).length;
  return {lean:lean, instinct:instinct, direction:direction, total:lean+instinct+direction};
}

/* ---------- screens ---------- */
function chips(list, sel, name, multi){
  return '<div class="chips">'+list.map(function(t,idx){
    var on = multi ? sel.indexOf(t)>-1 : sel===t;
    return '<button type="button" class="chip" data-chip="'+name+'" data-v="'+idx+'" aria-pressed="'+on+'">'+esc(t)+'</button>';
  }).join("")+'</div>';
}
var BACKNEXT = '<button class="btn ghost" data-act="back">Back</button><button class="btn" data-act="next">Continue</button>';
var V = {};
V.door = function(){
  return {label:"Members only", html:
    '<div class="hero">sm<span>pg</span></div>'+
    '<p class="lede">Ordinary questions. Uncommon company.</p>'+
    '<p>A private game for members, 21 and over. Ten everyday moments, answered on instinct, and we quietly look for someone on the same page as you.</p>'+
    '<div class="spacer"></div>'+
    '<label class="f" for="code">Invite code<input class="code" id="code" type="text" autocomplete="off" maxlength="12" placeholder="••••••" value="'+esc(S.code)+'"></label>'+
    '<div class="err" id="err" role="alert"></div>'+
    '<button class="link" data-act="request">No code? Request to play</button>'+
    '<button class="link" data-act="openhost">Host sign-in</button>',
    foot:'<button class="btn" data-act="enter">Enter</button>'};
};

function viewQ(k){
  var q=Q[k], r=Math.floor(k/PER_ROUND), done=S.ans[k]!==undefined, body, foot, letters="ABCD";
  if(!done && !S.seen[k]) S.seen[k]=Date.now();

  if(q.t==="pick"){
    body = '<div class="'+(done?"answered":"")+'" id="opts" style="display:flex;flex-direction:column;gap:10px">'+S.order[k].map(function(oi,pos){

    }).join("")+'</div>';
  } else if(q.t==="duel"){
    body = '<div class="duel '+(done?"answered":"")+'" id="opts">'+
      '<button class="opt" data-o="'+S.order[k][0]+'" aria-pressed="'+(S.ans[k]===S.order[k][0])+'"><span>'+esc(q.o[S.order[k][0]][0])+'</span></button>'+

  } else {

      '<input id="dial" type="range" min="0" max="'+(q.o.length-1)+'" step="1" value="'+dialVal+'" aria-label="Slide to answer" aria-valuetext="'+esc(q.o[dialVal][0])+'">'+
      '<div class="ends"><span>'+q.ends[0]+'</span><span>'+q.ends[1]+'</span></div></div>';
  }
  foot = '<button class="btn ghost" data-act="back">Back</button>';
  if(q.t==="dial") foot += '<button class="btn" data-act="lock">Lock it in</button>';
  else if(done) foot += '<button class="btn" data-act="next">Next</button>';

/* ---------- backend: Supabase, called over plain HTTPS ---------- */
var CFG = window.SMPG_CONFIG || {};
var API_ON = /^https?:\/\/\S+$/.test(CFG.url||"") && !!CFG.key && !/YOUR[-_]/i.test((CFG.url||"")+" "+(CFG.key||""));
var B = {state: API_ON?"idle":"off", last:null, remote:null, ready:false, loading:null, writing:false, again:false, timer:0, retry:0};
var H = {token:null, refresh:null, exp:0, ok:false, loaded:false, plays:[], requests:[], codes:[], msg:"", busy:false, email:"", label:"", confirm:null, poll:0};
var view = null, openRow = null;
var SYNC_TEXT = {
  idle:"", saving:"Saving...", saved:"Your answers are saved.",
  error:"Could not save just now. Your answers are kept on this device, and we will keep trying.",
  failed:"Your answers could not be saved. They are kept on this device.",
  off:"This copy of SMPG is not connected to its database yet."
};
var NO_REACH = "Could not reach SMPG. Check your connection and try again.";
function setSync(st){ B.state=st; var e=$("sync"); if(e) e.textContent=SYNC_TEXT[st]||""; }
function api(path, o){
  o=o||{};
  var h={"apikey":CFG.key, "Authorization":"Bearer "+(o.token||CFG.key)}, hasBody=o.body!==undefined;
  if(hasBody) h["Content-Type"]="application/json";
  var ctl = typeof AbortController==="function" ? new AbortController() : null, timer=setTimeout(function(){ if(ctl) ctl.abort(); }, 15000);
  return fetch(String(CFG.url).replace(/\/+$/,"")+path, {method:hasBody?"POST":"GET", headers:h, body:hasBody?JSON.stringify(o.body):undefined, signal:ctl?ctl.signal:undefined}).then(function(res){
    return res.text().then(function(t){
      clearTimeout(timer);
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      if(!res.ok) throw {status:res.status, body:j};
      return j;
    });
  }, function(){ clearTimeout(timer); throw {status:0}; });
}
function rpc(fn, args, token){ return api("/rest/v1/rpc/"+fn, {body:args||{}, token:token}); }

/* --- player side --- */
function buildRecord(){
  var id=steps()[Math.min(S.i, steps().length-1)], old=B.remote, prev=[], copy, r;
  if(old){
    prev = Array.isArray(old.previous) ? old.previous.slice(0,5) : [];
    if(old.runId!==S.runId && old.status==="complete"){ copy=Object.assign({}, old); delete copy.previous; delete copy.log; delete copy.client; prev=[copy].concat(prev).slice(0,5); }
  }
  r = {v:1, runId:S.runId, startedAt:S.startedAt, status: id==="done"?"complete":"in_progress", step:id, log:S.log.slice(-80),
       name:S.name.trim(), confirmed21:!!S.adult, area:S.area.trim(), gender:S.gender, orient:S.orient, age:S.age, topics:S.topics.slice(),
       intent:S.intent, intentLabel:S.intent?INTENTS[S.intent-1][0]:"",
       freakquency:(S.intent>=4 && S.freqSet==="set") ? S.freq : null, freakquencySkipped:S.intent>=4 && S.freqSet==="skip",
       answers:Q.map(function(q,k){ return S.ans[k]===undefined ? null : {n:k+1, type:q.t, question:q.q, answer:q.o[S.ans[k]][0], tags:q.o[S.ans[k]][1], instinct:S.fast[k]===true}; }).filter(Boolean),
       goals:S.goals.map(function(g){return g.trim();}), goalThemes:goalThemes(), scene:S.scene>=0?SCENES[S.scene]:"",
       traits:traitScores(), score:scoreParts(), previous:prev};
  r.client = JSON.parse(JSON.stringify(S)); delete r.client.code;   /* lets the member resume on another device */
  return r;
}
function buildRequest(){
  return {v:1, email:S.email.trim(), area:S.area.trim(), gender:S.gender, orient:S.orient, age:S.age,
          goals:S.goals.map(function(g){return g.trim();}), goalThemes:goalThemes(), sentAt:new Date().toISOString()};
}
function kickOut(){
  B.ready=false; B.remote=null; B.last=null; S.verified=false; S.i=0; setSync("idle");
  if(view!=="host"){ render(); err("This invite code is no longer active. Contact your host."); } else save();
}
/* Fetch the saved game for this code once per page load, so earlier completed runs are never overwritten. */
function ensureRemote(){
  if(B.ready) return Promise.resolve(true);
  if(!B.loading) B.loading = rpc("redeem_code",{p_code:S.code}).then(function(r){
    B.loading=null;
    if(!r || !r.ok){ kickOut(); return false; }
    B.remote=r.play||null; B.ready=true; return true;
  }, function(){ B.loading=null; return null; });
  return B.loading;
}
function canSync(){ return API_ON && !!S && S.verified===true && S.mode==="play" && S.i>=1; }
function queueSync(flush){ if(!canSync()) return; clearTimeout(B.timer); B.timer=setTimeout(pushSync, flush?0:900); }
function pushSync(){
  if(!canSync()) return;
  if(B.writing){ B.again=true; return; }
  B.writing=true; clearTimeout(B.retry);
  function later(){ setSync("error"); B.retry=setTimeout(pushSync, 8000); }
  ensureRemote().then(function(ok){
    if(ok===null){ later(); return; }
    if(!ok || !canSync()) return;
    var rec=buildRecord(), key=JSON.stringify(rec);
    if(B.last===key){ if(B.state!=="saved") setSync("saved"); return; }
    setSync("saving"); rec.updatedAt=new Date().toISOString();
    return rpc("save_play",{p_code:S.code, p_record:rec}).then(function(r){
      if(r && r.ok){ B.last=key; B.remote=rec; setSync("saved"); }
      else if(r && r.reason==="code") kickOut();
      else setSync("failed");
    }, later);
  }).then(function(){ B.writing=false; if(B.again){ B.again=false; pushSync(); } });
}
function enterWith(r){
  var c = r.play && r.play.client, p = r.prefill;
  if(c && typeof c==="object" && r.play.runId!==S.runId) S = normalize(c);
  else if(p && typeof p==="object" && !r.play){
    if(!S.area.trim()) S.area=str(p.area).slice(0,60);
    if(!S.gender && GENDERS.indexOf(p.gender)>-1) S.gender=p.gender;
    if(!S.orient && ORIENT.indexOf(p.orient)>-1) S.orient=p.orient;
    if(!S.age && AGES.indexOf(p.age)>-1) S.age=p.age;
    if(Array.isArray(p.goals) && S.goals.every(function(g){return !g.trim();})) S.goals=normalize({goals:p.goals}).goals;
  }
  S.code=r.code; S.verified=true; S.mode="play"; if(S.i<1) S.i=1;
  B.remote=r.play||null; B.ready=true; B.last=null; setSync("idle");
  render();
}
function tryCode(btn){
  var code=S.code.trim();
  S.mode="play";
  if(!code){ err("Enter your invite code."); return; }
  if(!API_ON){ err(SYNC_TEXT.off); return; }
  busy=true; btn.textContent="Checking...";
  rpc("redeem_code",{p_code:code}).then(function(r){
    busy=false;
    if(!r || !r.ok){ btn.textContent="Enter"; err("That code is not recognized. Check it and try again."); return; }
    enterWith(r);
  }, function(){ busy=false; btn.textContent="Enter"; err(NO_REACH); });
}
function sendRequest(btn){
  if(!API_ON){ err(SYNC_TEXT.off); return; }
  busy=true; btn.textContent="Sending...";
  rpc("submit_request",{p_record:buildRequest()}).then(function(r){
    busy=false;
    if(r && r.ok){ S.reqSent=true; go(1); }
    else { btn.textContent="Send request"; err("Your request could not be sent. Check the email address and try again."); }
  }, function(){ busy=false; btn.textContent="Send request"; err(NO_REACH); });
}

/* --- host side: sign in with a Supabase account listed in public.hosts --- */
function hostStore(){ try{ sessionStorage.setItem("smpg-host", JSON.stringify({token:H.token, refresh:H.refresh, exp:H.exp})); }catch(e){} }
function hostRestore(){ try{ var v=JSON.parse(sessionStorage.getItem("smpg-host")); if(v && v.refresh){ H.token=v.token; H.refresh=v.refresh; H.exp=+v.exp||0; } }catch(e){} }
function setTokens(j){ H.token=j.access_token; H.refresh=j.refresh_token; H.exp=Date.now()+(+j.expires_in||3600)*1000; hostStore(); }
function hostOut(msg){
  H.token=H.refresh=null; H.exp=0; H.ok=false; H.loaded=false; H.busy=false; H.plays=[]; H.requests=[]; H.codes=[]; H.confirm=null; H.msg=msg||"";
  clearInterval(H.poll); try{ sessionStorage.removeItem("smpg-host"); }catch(e){}
  if(view==="host") renderHost();
}
function hostToken(){
  if(H.token && Date.now()<H.exp-60000) return Promise.resolve(H.token);
  if(!H.refresh) return Promise.reject({status:401});
  return api("/auth/v1/token?grant_type=refresh_token",{body:{refresh_token:H.refresh}}).then(function(j){ setTokens(j); return H.token; },
    function(e){ throw (e && e.status===0) ? e : {status:401}; });
}
function hostApi(path, body){ return hostToken().then(function(t){ return api(path,{token:t, body:body}); }); }
function hostFail(e){
  H.busy=false;
  if(e && (e.status===401 || e.status===403)){ hostOut("Your session ended. Sign in again."); return; }
  H.msg = (e && e.status===0) ? NO_REACH : "That did not work. Try again.";
  if(view==="host") renderHost();
}
function typing(){ var a=document.activeElement; return !!(a && a.tagName==="INPUT"); }
function hostRefresh(quiet){
  var seq = H.seq = (H.seq||0)+1;   /* a slower, older refresh must not overwrite a newer one */
  return Promise.all([

/* ---------- flow ---------- */
function validate(id){
  if(id==="door") return (S.mode==="play" && !codeOk()) ? "Enter your invite code." : "";
  if(id==="reqEmail") return /^\S+@\S+\.\S+$/.test(S.email.trim()) ? "" : "Enter a valid email address so we can reach you.";
  if(id==="signup"){ if(!S.name.trim()) return "Add your first name."; if(!S.adult) return "This game is for members 21 and over. Tick the box to confirm."; return ""; }
  if(id==="about"){ if(!S.area.trim()) return "Tell us roughly where you are based."; if(!S.gender||!S.orient||!S.age) return "Choose one option for gender, orientation and age range."; return ""; }
  if(id==="topics") return S.topics.length<3 ? "Pick at least three topics." : "";
  if(id==="intent") return S.intent ? "" : "Choose one option to continue.";
  if(id==="freq") return S.freqSet===null ? "Save a number or skip." : "";
  if(id.charAt(0)==="q") return S.ans[+id.slice(1)]===undefined ? "Choose an answer." : "";
  if(id==="goals"){ var left=S.goals.filter(function(g){return words(g)<4;}).length; return left ? left+" goal"+(left>1?"s":"")+" still to finish. Each needs at least four words." : ""; }
  if(id==="final") return S.scene<0 ? "Choose a scene to finish." : "";
  return "";
}
/* Never show a step whose earlier steps are incomplete. */
function gate(){
  var st=steps(), j;
  if(S.i>st.length-1) S.i=st.length-1;
  for(j=0;j<S.i;j++){ if(validate(st[j])){ S.i=j; return; } }
  if(st[S.i]==="reqDone" && !S.reqSent) S.i--;
}
function render(){
  clearInterval(tick); busy=false;

  gate();

  if(!S.log.length || S.log[S.log.length-1].step!==id){ S.log.push({t:new Date().toISOString(), step:id}); if(S.log.length>80) S.log=S.log.slice(-80); }
  if(/^q\d+$/.test(id)) v=viewQ(+id.slice(1));
  else if(/^r\d+$/.test(id)) v=viewRound(+id.slice(1));
  else v=V[id]();
  $("main").innerHTML='<div class="leaf">'+(v.eyebrow?'<div class="eyebrow">'+v.eyebrow+'</div>':"")+v.html+'</div>';
  $("foot").innerHTML=v.foot||"";

  $("pageno").textContent=v.label;

function err(m){ var e=$("err"); if(e) e.textContent=m; }

function startTimer(k){
  var bar=$("tbar"), lab=$("tlabel");
  function done(){ bar.style.width="0%"; lab.textContent = S.fast[k]===true ? "Instinct bonus earned" : "Answered"; }
  function upd(){
    if(S.ans[k]!==undefined){ clearInterval(tick); done(); return; }
    var rem = LIMIT-(Date.now()-S.seen[k]);
    if(rem<=0){ clearInterval(tick); bar.style.width="0%"; lab.textContent="Bonus gone. Take your time."; return; }
    bar.style.width=(100*rem/LIMIT)+"%"; lab.textContent="Instinct bonus · "+Math.ceil(rem/1000)+"s";
  }
  upd(); if(S.ans[k]===undefined) tick=setInterval(upd,100);

function answer(k, oi){
  if(busy) return;
  var prev=S.ans[k], had=S.fast[k]===true, msg;

  S.ans[k]=oi;
  if(prev===undefined){ S.fast[k] = (Date.now()-S.seen[k])<=LIMIT; msg = S.fast[k] ? "Instinct +3" : "Noted"; }
  else { S.fast[k]=false; msg = had ? "Changed. Instinct bonus given up." : "Changed"; }
  save(); busy=true; pulse=1;
  var box=$("opts");
  if(box){ box.classList.add("answered"); box.querySelectorAll(".opt").forEach(function(o){ o.setAttribute("aria-pressed", String(+o.getAttribute("data-o")===oi)); }); }
  clearInterval(tick);
  $("tbar").style.width="0%"; $("tlabel").textContent = S.fast[k] ? "Instinct bonus earned" : "Answered";
  $("toast").textContent=msg;

  else if(Q[k].t==="duel" && key==="arrowleft") pos=0;
  else if(Q[k].t==="duel" && key==="arrowright") pos=1;
  if(pos>-1 && pos<Q[k].o.length){ ev.preventDefault(); answer(k, S.order[k][pos]); }
});

/* ---------- the wavelength: shaped by the answers, used as progress line, dial and keepsake ---------- */
function fit(c){
  var d=Math.min(window.devicePixelRatio||1,2), w=Math.round(c.clientWidth*d), h=Math.round(c.clientHeight*d);
  if(w && h && (c.width!==w || c.height!==h)){ c.width=w; c.height=h; }
  return d;
}
function waveParams(){
  var t=traitScores();
  return { f: 1.6+3.2*(t.PCE.score+t.SPN.score)/200, a: 0.45+0.5*(t.SOC.score+t.PLY.score)/200, h: 0.6*t.CUR.score/100 };
}
function trace(x, c, P, ph, from, to, amp){
  var w=c.width, h=c.height, i, xn, y, first=true;
  x.beginPath();
  for(i=Math.floor(from*w); i<=Math.ceil(to*w); i+=2){
    xn=i/w;
    y = h/2 + Math.sin(Math.PI*xn)*P.a*amp*(h/2-3)*(Math.sin(xn*P.f*2*Math.PI+ph)+P.h*Math.sin(xn*P.f*4*Math.PI+ph*1.4))/(1+P.h);
    if(first){ x.moveTo(i,y); first=false; } else x.lineTo(i,y);
  }
  x.stroke();
}
var freqCur = 5;
function paint(now){
  var ph = still ? 0 : now/700, P=waveParams(), c, x, d, prog, st=steps();
  pulse *= 0.93;
  c=$("strip"); d=fit(c); x=c.getContext("2d"); x.clearRect(0,0,c.width,c.height); x.lineCap="round";
  prog = st.length>1 ? S.i/(st.length-1) : 0;
  x.lineWidth=1.5*d; x.strokeStyle="#2c4047"; trace(x,c,P,ph,prog,1,0.55);
  x.lineWidth=2*d; x.strokeStyle="#ff9f7a"; if(prog>0) trace(x,c,P,ph,0,prog,0.55+0.45*pulse);
  c=$("big");
  if(c){ d=fit(c); x=c.getContext("2d"); x.clearRect(0,0,c.width,c.height); x.lineCap="round"; x.lineWidth=2.5*d; x.strokeStyle="#ff9f7a"; trace(x,c,P,ph,0,1,1); }
  c=$("wave");
  if(c){
    freqCur += (S.freq-freqCur)*(still?1:0.12);
    d=fit(c); x=c.getContext("2d"); x.clearRect(0,0,c.width,c.height); x.lineCap="round";
    x.lineWidth=1.5*d; x.strokeStyle="rgba(157,176,175,.45)"; trace(x,c,{f:0.8+freqCur*0.75,a:0.8,h:0},ph*(1+freqCur*0.2)+1.2,0,1,1);
    x.lineWidth=3*d; x.strokeStyle="#ff9f7a"; trace(x,c,{f:0.8+freqCur*0.75,a:0.8,h:0},ph*(1+freqCur*0.2),0,1,1);
  }
}
function loop(now){ paint(now); requestAnimationFrame(loop); }
function countUp(){
  var el=$("sc"), to=+el.getAttribute("data-to"), t0;
  if(counted || still){ el.textContent=to; counted=true; return; }
  counted=true;
  function step(now){
    if(!document.body.contains(el)) return;
    if(!t0) t0=now;
    var f=Math.min(1,(now-t0)/900);
    el.textContent=Math.round(to*(1-Math.pow(1-f,3)));
    if(f<1) requestAnimationFrame(step); else el.textContent=to;
  }
  requestAnimationFrame(step);
}
window.addEventListener("resize", function(){ paint(performance.now()); });

/* ---------- boot ---------- */
S = normalize(load());
freqCur = S.freq;
render();
if(!still) requestAnimationFrame(loop);
if(canSync()) queueSync(true);
</script>
